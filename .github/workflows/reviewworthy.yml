name: Reviewworthy regression checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewworthy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package metadata
        run: python -m pip install --no-deps --editable .
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests
      - name: Run fixture evaluations
        env:
          PYTHONPATH: src
        run: python -m reviewworthy eval run --json
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Parse JSON schemas
        run: >-
          python -c
          "import json; from pathlib import Path; [json.loads(p.read_text()) for p in Path('schemas').glob('*.json')]"
