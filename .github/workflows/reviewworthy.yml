name: Reviewworthy deterministic checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewworthy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run local Action checks
        env:
          PYTHONPATH: src
        run: python -m reviewworthy action check .reviewworthy/contribution.json --json
