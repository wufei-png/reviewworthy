[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewworthy"
version = "0.3.0a1"
description = "Contributor-side evidence for bounded, understood, reviewworthy AI-assisted contributions."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Reviewworthy contributors" }]
dependencies = []
keywords = ["open-source", "agent-skill", "github", "contributions", "ai-policy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
reviewworthy = "reviewworthy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
