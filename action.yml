name: Reviewworthy deterministic contribution checks
description: Run Reviewworthy's read-only Action checks against a Contribution Packet
inputs:
  packet:
    description: Repository-relative Contribution Packet path
    required: false
    default: .reviewworthy/contribution.json
  changed-files:
    description: Newline-separated changed files; on pull_request events the action derives them from the event SHAs when omitted
    required: false
  mode:
    description: report (default, non-blocking unknowns) or enforce (require a packet, current diff, and known evidence)
    required: false
    default: report
  require-packet:
    description: Fail when the Contribution Packet is missing
    required: false
    default: 'false'
  fail-on-unknown:
    description: Turn unknown policy or evidence into a failure
    required: false
    default: 'false'
  require-current-diff:
    description: Require changed files derived from the current event or supplied input
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Run deterministic Reviewworthy checks
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        REVIEWWORTHY_PACKET: ${{ inputs.packet }}
        REVIEWWORTHY_CHANGED_FILES: ${{ inputs.changed-files }}
        REVIEWWORTHY_MODE: ${{ inputs.mode }}
        REVIEWWORTHY_REQUIRE_PACKET: ${{ inputs.require-packet }}
        REVIEWWORTHY_FAIL_ON_UNKNOWN: ${{ inputs.fail-on-unknown }}
        REVIEWWORTHY_REQUIRE_CURRENT_DIFF: ${{ inputs.require-current-diff }}
        REVIEWWORTHY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        REVIEWWORTHY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        changed_files="${REVIEWWORTHY_CHANGED_FILES:-}"
        changed_files_available=false
        if [[ -n "$changed_files" ]]; then
          changed_files_available=true
        fi
        if [[ -z "$changed_files" && -n "${REVIEWWORTHY_BASE_SHA:-}" && -n "${REVIEWWORTHY_HEAD_SHA:-}" ]]; then
          if git cat-file -e "$REVIEWWORTHY_BASE_SHA^{commit}" 2>/dev/null && git cat-file -e "$REVIEWWORTHY_HEAD_SHA^{commit}" 2>/dev/null; then
            if ! changed_files="$(git diff --name-only "$REVIEWWORTHY_BASE_SHA" "$REVIEWWORTHY_HEAD_SHA" 2>/dev/null)"; then
              echo "Reviewworthy: changed-file evidence could not be derived from the supplied pull-request SHAs." >&2
              changed_files=""
            else
              changed_files_available=true
            fi
          else
            echo "Reviewworthy: pull-request SHAs are not available in this checkout; changed-file scope will be reported as unknown." >&2
          fi
        fi
        args=()
        while IFS= read -r path; do
          [[ -n "$path" ]] && args+=(--changed-file "$path")
        done <<< "$changed_files"
        if [[ "$changed_files_available" == true ]]; then
          args+=(--changed-files-provided)
        else
          args+=(--changed-files-unavailable)
        fi
        case "${REVIEWWORTHY_MODE:-report}" in
          report|enforce)
            args+=(--mode "${REVIEWWORTHY_MODE:-report}")
            ;;
          *)
            echo "Reviewworthy: mode must be report or enforce." >&2
            exit 2
            ;;
        esac
        if [[ "${REVIEWWORTHY_REQUIRE_PACKET:-false}" == true ]]; then
          args+=(--require-packet)
        fi
        if [[ "${REVIEWWORTHY_FAIL_ON_UNKNOWN:-false}" == true ]]; then
          args+=(--fail-on-unknown)
        fi
        if [[ "${REVIEWWORTHY_REQUIRE_CURRENT_DIFF:-false}" == true ]]; then
          args+=(--require-current-diff)
        fi
        python -m reviewworthy action check "$REVIEWWORTHY_PACKET" "${args[@]}"
